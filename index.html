<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kanban Improyek</title>
    <link href="./styles/output.css" rel="stylesheet" />
  </head>
  <body>
    <div class="kanban-board">
      <div class="kanban-header">
        <div class="kanban-header-title">Template Board</div>
        <div class="kanban-header-options">
          <div class="kanban-header-options-usersConnected">
            <div class="kanban-header-options-usersConnected-bubble">GT</div>
            <div class="kanban-header-options-usersConnected-bubble">JA</div>
            <div class="kanban-header-options-usersConnected-bubble">RE</div>
          </div>
          <div class="kanban-header-options-shareBotton">Share</div>
          <div class="kanban-header-options-userBubble">GT</div>
        </div>
      </div>
      <div class="kanban-columns">
        <div class="kanban-board-column ">
          <div class="kanban-board-column-header">
            <p>To Do</p>
            <span>...</span>
          </div>
          <div class="kanban-board-column-content">
            <div class="kanban-board-card">
              <h3 class="font-semibold">Task 1</h3>
              <p class="text-sm text-gray-600">Description of Task 1</p>
            </div>
            <div class="kanban-board-card">
              <h3 class="font-semibold">Task 2</h3>
              <p class="text-sm text-gray-600">Description of Task 2</p>
            </div>
          </div>
        </div>
        <div class="kanban-board-column bg-yellow-50">
          <h2 class="text-xl font-bold mb-4">In Progress</h2>
          <div class="kanban-board-column-content">
            <div class="kanban-board-card">
              <h3 class="font-semibold">Task 3</h3>
              <p class="text-sm text-gray-600">Description of Task 3</p>
            </div>
          </div>
        </div>
        <div class="kanban-board-column bg-green-50">
          <h2 class="text-xl font-bold mb-4">Testing</h2>
          <div class="kanban-board-column-content">
            <div class="kanban-board-card">
              <h3 class="font-semibold">Task 4</h3>
              <p class="text-sm text-gray-600">Description of Task 4</p>
            </div>
          </div>
        </div>
        <div class="kanban-board-column bg-blue-50">
          <h2 class="text-xl font-bold mb-4">Done</h2>
          <div class="kanban-board-column-content">
            <div class="kanban-board-card">
              <h3 class="font-semibold">Task 4</h3>
              <p class="text-sm text-gray-600">Description of Task 4</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
